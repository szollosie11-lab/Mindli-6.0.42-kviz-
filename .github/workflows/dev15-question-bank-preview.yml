name: DEV15 central question bank WebView preview
on:
  push:
    branches: [ dev15-central-bank-preview ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  browser-preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test-only IndexedDB emulator
        run: npm install --no-save --no-audit --no-fund fake-indexeddb@6
      - name: Validate WebView adapter syntax
        run: node --check central-question-bank-preview.js
      - name: Test atomic multi-language cache and offline fallback
        run: node --test test/dev15-question-bank-preview.test.mjs test/dev15-indexeddb.test.mjs
