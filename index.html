<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <title>Mindli</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    try {
      const saved=JSON.parse(localStorage.getItem('quiz-v2-settings')||'{}'),choice=saved.theme||'system';
      const palette=choice==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):choice;
      document.documentElement.dataset.theme=['dark','midnight','ocean','sunset'].includes(palette)?'dark':'light';
      document.documentElement.dataset.palette=palette;
      document.documentElement.dataset.themeChoice=choice;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section class="screen loading-screen">
      <div class="logo"><img src="icons/icon.svg" alt="" aria-hidden="true"></div>
      <p>Načítavam otázky…</p>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="questions.js"></script>
  <script src="xlsx.full.min.js"></script>
  <script src="qrcode.js"></script>
  <script src="offline-visuals.js"></script>
  <script src="country-facts.js"></script>
  <script src="core.js"></script>
  <script src="wifi-web-bridge.js"></script>
  <script src="central-question-bank-preview.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
